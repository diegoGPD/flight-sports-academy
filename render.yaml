services:
  - type: web
    name: flight-sports-academy
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NOTIFY_WEBHOOK_URL
        sync: false
    disk:
      name: fsa-data
      mountPath: /var/data
      sizeGB: 2
